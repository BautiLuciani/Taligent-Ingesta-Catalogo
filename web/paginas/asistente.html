<header class="chat-cabeza">
<div class="chat-cabeza-textos">
<h1 class="titulo">Asistente</h1>
<p class="bajada">Preguntale lo que quieras sobre las fichas, un producto o un proveedor.</p>
</div>
<button type="button" class="boton-primario boton-nueva" id="nueva">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Nueva conversación</button>
</header>

<section class="conversacion" aria-label="Conversación" id="conversacion">
<div class="mensajes" id="mensajes" aria-live="polite"></div>
</section>

<div class="chat-pie">
<div class="chat-pie-dentro">
<div class="sugerencias" id="sugerencias"></div>
<form class="caja" id="caja">
<label for="pregunta" class="solo-lectores">Tu pregunta</label>
<textarea id="pregunta" rows="1" placeholder="Preguntale algo al asistente…"></textarea>
<button type="submit" aria-label="Enviar" class="boton-primario boton-enviar" id="enviar"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg></button>
</form>
<span class="ayuda">Enter para enviar, Shift + Enter para una línea nueva. El asistente solo lee: nunca cambia una ficha.</span>
</div>
</div>
